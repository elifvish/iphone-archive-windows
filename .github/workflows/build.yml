name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore IphoneArchive.sln

      - name: Build
        run: dotnet build IphoneArchive.sln -c Release --no-restore --warnaserror

      - name: Publish self-contained Windows app
        run: dotnet publish src/IphoneArchive/IphoneArchive.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: IphoneArchive-win-x64
          path: artifacts/win-x64/IphoneArchive.exe
          if-no-files-found: error
